name: PR tests (read-only)

on:
  pull_request:
    paths:
      - '**/*.gs'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/pr-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install CI parser dependencies
        run: npm install --prefix tools/ci --no-save --no-package-lock acorn yaml
      - name: Run offline unit tests
        run: node --test tests/core.test.cjs tests/upload.test.cjs tests/actions.test.cjs
      - name: Validate patch whitespace
        run: git diff --check HEAD~1 HEAD
